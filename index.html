<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example A — AI Count Only</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: auto; padding: 20px; }
        img { width: 100%; max-width: 600px; border: 1px solid #ccc; margin-bottom: 20px; }
        .section { margin-bottom: 25px; }
        label { display: block; margin-top: 10px; }
    </style>
</head>

<body>
    <h2>AI DETECTION AND QUANTIFICATION</h2>
    <p>This page shows AI-generated count of the red circles inside the image.</p>

    <div class="section">
        <img src="original.png" alt="original.png">
        <img src="No_Explainable_AI.png" alt="No_Explainable_AI.png">
        <p><strong>AI Count:</strong> <span id="aiCount">13</span></p>
    </div>

    <!-- FORM SECTION -->
    <form id="responseForm">
        <h3>Checklist</h3>
        <label><input type="checkbox" name="reviewed"> I reviewed the image</label>
        <label><input type="checkbox" name="reasonable"> The AI count seems reasonable.</label>
        <label><input type="checkbox" name="confident"> I am confident in my evaluation.</label>

        <h3>Decision</h3>
        <label><input type="radio" name="decision" value="accept"> I accept the AI count</label>
        <label><input type="radio" name="decision" value="reject"> I reject the AI count</label>

        <label>What is the count? (if rejecting):
            <input type="number" name="correctCount">
        </label>

        <button type="submit">Submit</button>
    </form>

    <!-- SCRIPT TO SEND DATA TO GOOGLE SHEETS -->
    <script>
        document.getElementById("responseForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const data = {
                reviewed: document.querySelector("input[name='reviewed']").checked,
                reasonable: document.querySelector("input[name='reasonable']").checked,
                confident: document.querySelector("input[name='confident']").checked,
                decision: document.querySelector("input[name='decision']:checked")?.value || "",
                correctCount: document.querySelector("input[name='correctCount']").value,
                aiCount: document.getElementById("aiCount").innerText,
                timestamp: new Date().toISOString()
            };

            fetch("YOUR_GOOGLE_SCRIPT_URL", {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            alert("Response submitted!");
        });
    </script>

</body>
</html>
